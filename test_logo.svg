<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 95" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Blue Gradient for S-ribbon and Stay -->
    <linearGradient id="full-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0052EA" />
    </linearGradient>
    <linearGradient id="full-cyan-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="ss-subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ==================== LEFT: BRAND ICON MARK ==================== -->
  <g class="brand-mark" transform="translate(4, -2)">
    <!-- Circuit Traces & Nodes -->
    <g stroke="url(#full-cyan-grad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 58 35 L 58 26 Q 58 20 54 18 L 51 16" />
      <path d="M 65 40 L 65 26 Q 65 18 69 14 L 70 12" />
      <path d="M 72 45 L 75 36 Q 77 28 82 24 L 83 23" />
    </g>

    <!-- Circuit Nodes -->
    <circle cx="51" cy="16" r="3.2" fill="#00A3E0" />
    <circle cx="51" cy="16" r="1.3" fill="#FFFFFF" />
    <circle cx="70" cy="12" r="3.6" fill="#00A3E0" />
    <circle cx="70" cy="12" r="1.5" fill="#FFFFFF" />
    <circle cx="83" cy="23" r="3.2" fill="#00A3E0" />
    <circle cx="83" cy="23" r="1.3" fill="#FFFFFF" />

    <!-- Roof Gable -->
    <path
      d="M 10 50 L 44 20 L 78 50 L 71 55.5 L 44 31.5 L 17 55.5 Z"
      fill="#021F43"
    />

    <!-- 4 Window Panes -->
    <g fill="url(#full-blue-grad)">
      <rect x="37.5" y="36.5" width="5.4" height="4.8" rx="0.9" />
      <rect x="45" y="36.5" width="5.4" height="4.8" rx="0.9" />
      <rect x="37.5" y="43" width="5.4" height="4.8" rx="0.9" />
      <rect x="45" y="43" width="5.4" height="4.8" rx="0.9" />
    </g>

    <!-- Flowing S Ribbon -->
    <path
      d="M 16.5 52.5 
         C 13 58 13.5 65.5 21 68 
         C 28 70.5 40 66 56 66 
         C 70 66 77 70 77 76 
         C 77 82 70 86 60 86 
         C 45 86 33 83.5 23 80.5 
         C 19.5 79.5 17 81.5 17 84.5 
         C 17 87 19.5 89 24 90.5 
         C 35 94 49 95 62 94 
         C 76 93 85 86.5 85 75 
         C 85 63.5 74 58.5 58 58.5 
         C 42 58.5 30 61.5 24 59.5 
         C 20.5 58.5 19.5 55.5 21 52.5 Z"
      fill="url(#full-blue-grad)"
    />

    <!-- House Base & Arched Door -->
    <path
      d="M 17 88 
         L 17 98 
         L 35 98 
         L 35 85.5 
         C 35 80 53 80 53 85.5 
         L 53 98 
         L 71 98 
         L 71 93 
         C 67.5 95 63 96.2 58 96.5 
         C 44 97.2 29 95 17 88 Z"
      fill="#021F43"
    />
  </g>

  <!-- ==================== RIGHT: BRAND TYPOGRAPHY ==================== -->
  <g class="brand-text" transform="translate(102, 0)">
    <!-- Primary Logotype: "SmartStay" -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.03em">
      <tspan fill="#021F43">Smart</tspan><tspan fill="#0066FF">Stay</tspan>
    </text>

    <!-- Tagline: "— Campus Living —" -->
    <g class="brand-tagline" transform="translate(2, 79)">
      <!-- Left Divider Bar -->
      <line x1="0" y1="-5" x2="26" y2="-5" stroke="#021F43" stroke-width="2" stroke-linecap="round" />
      
      <!-- Subtitle Text -->
      <text x="35" y="0" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="14.5" fill="#021F43" letter-spacing="0.16em">
        CAMPUS LIVING
      </text>

      <!-- Right Divider Bar -->
      <line x1="198" y1="-5" x2="224" y2="-5" stroke="#021F43" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>