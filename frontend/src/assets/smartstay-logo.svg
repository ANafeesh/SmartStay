<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none" class="smartstay-full-logo-svg">
  <!-- ==================== LEFT: ICON MARK ==================== -->
  <g class="brand-mark" transform="translate(1, 1)">
    <!-- Rounded Square Container -->
    <rect width="48" height="48" rx="11" fill="#011838" />

    <!-- House Outline -->
    <path
      d="M 11.5 23 L 24 11.5 L 36.5 23 M 14 22 V 37.5 H 34 V 22"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Keyhole (Cyan Accent) -->
    <path
      d="M 24 23.5 C 22.35 23.5 21 24.85 21 26.5 C 21 27.5 21.5 28.35 22.25 28.9 L 21.3 34.5 H 26.7 L 25.75 28.9 C 26.5 28.35 27 27.5 27 26.5 C 27 24.85 25.65 23.5 24 23.5 Z"
      fill="#00C2FF"
    />
  </g>

  <!-- ==================== RIGHT: TYPOGRAPHY ==================== -->
  <g class="brand-text" transform="translate(60, 0)">
    <!-- Main Logotype: SmartStay -->
    <text
      x="0"
      y="34"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="800"
      font-size="31"
      letter-spacing="-0.035em"
      fill="#011838"
    >SmartStay</text>
  </g>
</svg>
